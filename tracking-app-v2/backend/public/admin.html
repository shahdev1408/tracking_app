<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Admin Dashboard - Tracking App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    margin: 0; background: #0f172a; color: #f1f5f9;
  }
  .hidden { display: none !important; }

  /* Login screen */
  #loginScreen {
    display: flex; align-items: center; justify-content: center;
    height: 100vh;
  }
  .login-box {
    background: #1e293b; padding: 32px; border-radius: 12px; width: 320px;
  }
  .login-box h2 { margin-top: 0; text-align: center; }
  .login-box input {
    width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px;
    border: none; background: #0b1220; color: #f1f5f9; font-size: 14px;
  }
  .login-box button {
    width: 100%; padding: 12px; margin-top: 12px; border: none; border-radius: 8px;
    background: #22c55e; color: white; font-weight: bold; font-size: 14px; cursor: pointer;
  }
  .login-box button:hover { background: #16a34a; }
  .error-msg { color: #f87171; font-size: 13px; margin-top: 8px; text-align: center; }

  /* Dashboard */
  #dashboard { display: none; }
  header {
    padding: 16px 24px; background: #1e293b; display: flex;
    justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 18px; margin: 0; }
  header button {
    background: #334155; color: #f1f5f9; border: none; padding: 8px 16px;
    border-radius: 8px; cursor: pointer;
  }
  .layout { display: flex; height: calc(100vh - 60px); }
  #employeePanel {
    width: 340px; background: #1e293b; padding: 16px; overflow-y: auto;
  }
  #employeePanel h3 { margin-top: 0; }
  .emp-row {
    background: #0b1220; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 13px;
  }
  .emp-row .name { font-weight: bold; }
  .emp-row .sub { color: #94a3b8; font-size: 11px; }
  .emp-row button {
    background: #ef4444; color: white; border: none; padding: 6px 10px;
    border-radius: 6px; cursor: pointer; font-size: 11px;
  }
  #map { flex: 1; }
  .add-form { margin-top: 16px; border-top: 1px solid #334155; padding-top: 16px; }
  .add-form input, .add-form select {
    width: 100%; padding: 8px; margin: 4px 0; border-radius: 6px; border: none;
    background: #0b1220; color: #f1f5f9; font-size: 13px;
  }
  .add-form button {
    width: 100%; padding: 10px; margin-top: 8px; border: none; border-radius: 6px;
    background: #22c55e; color: white; font-weight: bold; cursor: pointer;
  }

  .emp-row { cursor: pointer; }
  .emp-row:hover { background: #16233a; }
  .emp-actions { display: flex; gap: 4px; }
  .emp-actions button { font-size: 11px; padding: 6px 8px; border: none; border-radius: 6px; cursor: pointer; }
  .btn-edit { background: #334155; color: #f1f5f9; }
  .btn-remove { background: #ef4444; color: white; }

  /* Modal */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center;
    z-index: 9999;
  }
  .modal-box {
    background: #1e293b; padding: 24px; border-radius: 12px; width: 600px;
    max-height: 80vh; overflow-y: auto;
  }
  .modal-box h2 { margin-top: 0; }
  .modal-box input, .modal-box select {
    width: 100%; padding: 10px; margin: 6px 0; border-radius: 8px;
    border: none; background: #0b1220; color: #f1f5f9; font-size: 14px;
  }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .modal-actions button {
    flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
  }
  .btn-save { background: #22c55e; color: white; }
  .btn-cancel { background: #334155; color: #f1f5f9; }
  .btn-danger { background: #ef4444; color: white; }

  .day-row {
    background: #0b1220; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 13px;
  }
  .day-row .date { font-weight: bold; color: #22c55e; }
  .day-row .stat { color: #94a3b8; }
  .day-row .btn-route {
    margin-top: 6px; background: #3b82f6; color: white; border: none;
    padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11px;
  }

  .section-toggle {
    margin-top: 10px; padding: 6px 8px; background: #16233a; border-radius: 6px;
    cursor: pointer; font-size: 12px; font-weight: bold; color: #f1f5f9;
  }
  .section-toggle:hover { background: #1c2b45; }
  .section-body { margin-top: 6px; max-height: 260px; overflow-y: auto; }
  .point-row {
    background: #0b1220; padding: 8px 10px; border-radius: 6px; margin-bottom: 6px;
    font-size: 11px; color: #cbd5e1; border-left: 3px solid #3b82f6;
  }
  .point-row .mono { font-family: monospace; color: #94a3b8; }
  .point-row .place { color: #60a5fa; font-style: italic; }

  .btn-delete-point {
    background: #7f1d1d; color: #fca5a5; border: none; border-radius: 4px;
    width: 22px; height: 22px; cursor: pointer; font-size: 12px; flex-shrink: 0;
  }
  .btn-delete-point:hover { background: #ef4444; color: white; }

  .btn-download {
    background: #22c55e; color: white; border: none; padding: 4px 10px;
    border-radius: 6px; cursor: pointer; font-size: 12px;
  }

  .btn-live {
    background: #f59e0b; color: white; border: none; font-size: 11px;
    padding: 6px 8px; border-radius: 6px; cursor: pointer;
  }
  .btn-live.active { background: #ef4444; }

  .pulse-dot {
    width: 16px; height: 16px; border-radius: 50%; background: #3b82f6;
    border: 3px solid white; box-shadow: 0 0 0 rgba(59,130,246,0.6);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(59,130,246,0.6); }
    70% { box-shadow: 0 0 0 12px rgba(59,130,246,0); }
    100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); }
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-box">
    <h2>Manager Login</h2>
    <input id="loginEmployeeId" placeholder="Employee ID" />
    <input id="loginPassword" type="password" placeholder="Password" />
    <button onclick="login()">Log In</button>
    <div id="loginError" class="error-msg"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header>
    <h1>Employee Tracking Dashboard</h1>
    <button onclick="logout()">Log Out</button>
  </header>
  <div class="layout">
    <div id="employeePanel">
      <h3>Employees</h3>
      <div id="employeeList"></div>

      <div class="add-form">
        <h3>Add Employee</h3>
        <input id="newEmpId" placeholder="Employee ID (e.g. EMP002)" />
        <input id="newEmpName" placeholder="Full Name" />
        <input id="newEmpRate" type="number" step="0.01" placeholder="Pay Rate per Km (e.g. 10)" />
        <input id="newEmpPassword" type="password" placeholder="Temporary Password" />
        <button onclick="addEmployee()">Add Employee</button>
      </div>
    </div>
    <div id="map"></div>
  </div>
</div>

<!-- EMPLOYEE DETAIL / EDIT MODAL -->
<div id="detailModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h2 id="detailName">Employee</h2>
    <div id="detailStats" style="color:#94a3b8; font-size:13px; margin-bottom:12px;"></div>

    <h3 style="margin-bottom:6px;">Daily Summary (Punch In → Out, Km travelled)</h3>
    <div id="dailyList"></div>

    <h3 style="margin-bottom:6px; margin-top:20px;">Edit Employee</h3>
    <input id="editName" placeholder="Full Name" />
    <input id="editPhone" placeholder="Phone (optional)" />
    <input id="editRate" type="number" step="0.01" placeholder="Pay Rate per Km (e.g. 10)" />
    <input id="editPassword" type="password" placeholder="New Password (leave blank to keep current)" />
    <div class="modal-actions">
      <button class="btn-save" onclick="saveEdit()">Save Changes</button>
      <button class="btn-cancel" onclick="closeModal()">Close</button>
    </div>
    <div class="modal-actions">
      <button class="btn-danger" onclick="permanentDelete()">Permanently Delete Account</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Change this if your backend URL is different
  const API_BASE = window.location.origin;

  let token = localStorage.getItem("adminToken") || "";
  let map, markers = {};

  // ---------- Login ----------
  async function login() {
    const employeeId = document.getElementById("loginEmployeeId").value.trim();
    const password = document.getElementById("loginPassword").value;
    const errorBox = document.getElementById("loginError");
    errorBox.textContent = "";

    try {
      const res = await fetch(`${API_BASE}/api/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ employeeId, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Login failed");

      if (data.user.role !== "manager") {
        throw new Error("This account is not a manager. Use a manager account.");
      }

      token = data.token;
      localStorage.setItem("adminToken", token);
      showDashboard();
    } catch (err) {
      errorBox.textContent = err.message;
    }
  }

  function logout() {
    localStorage.removeItem("adminToken");
    token = "";
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("loginScreen").style.display = "flex";
  }

  // ---------- Dashboard ----------
  async function showDashboard() {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    initMap();
    await loadEmployees();
  }

  function initMap() {
    if (map) return;
    map = L.map("map").setView([22.7788, 73.6142], 7); // default center (Gujarat area)
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);
  }

  async function loadEmployees() {
    try {
      const res = await fetch(`${API_BASE}/api/auth/users`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to load employees");

      renderEmployeeList(data.users);
      renderMapMarkers(data.users);
    } catch (err) {
      alert(err.message);
    }
  }

  function renderEmployeeList(users) {
    const list = document.getElementById("employeeList");
    list.innerHTML = "";
    users.forEach((u) => {
      const row = document.createElement("div");
      row.className = "emp-row";
      const lastSeen = u.lastLocation?.timestamp
        ? new Date(u.lastLocation.timestamp).toLocaleString()
        : "Never";
      row.innerHTML = `
        <div onclick="openDetail('${u.employeeId}')" style="flex:1">
          <div class="name">${u.name} (${u.employeeId})</div>
          <div class="sub">${u.role} · ${u.active ? "active" : "inactive"} · last seen: ${lastSeen}</div>
        </div>
        ${u.role !== "manager" ? `
          <div class="emp-actions">
            <button class="btn-live ${liveTrackingEmployeeId === u.employeeId ? 'active' : ''}" onclick="event.stopPropagation(); toggleLiveTracking('${u.employeeId}')">
              ${liveTrackingEmployeeId === u.employeeId ? 'Stop Live' : 'Track Live'}
            </button>
            <button class="btn-edit" onclick="event.stopPropagation(); openDetail('${u.employeeId}')">Edit</button>
            <button class="btn-remove" onclick="event.stopPropagation(); removeEmployee('${u.employeeId}')">Remove</button>
          </div>` : ""}
      `;
      list.appendChild(row);
    });
  }

  let currentDetailEmployeeId = null;

  async function openDetail(employeeId) {
    currentDetailEmployeeId = employeeId;
    document.getElementById("detailModal").classList.remove("hidden");
    document.getElementById("detailName").textContent = "Loading...";
    document.getElementById("dailyList").innerHTML = "";

    try {
      // Get employee basic info from the already-loaded list
      const usersRes = await fetch(`${API_BASE}/api/auth/users`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      const usersData = await usersRes.json();
      const emp = usersData.users.find((u) => u.employeeId === employeeId);

      document.getElementById("detailName").textContent = `${emp.name} (${emp.employeeId})`;
      document.getElementById("editName").value = emp.name;
      document.getElementById("editPhone").value = emp.phone || "";
      document.getElementById("editRate").value = emp.ratePerKm || 0;
      document.getElementById("editPassword").value = "";

      // Get daily summary for payroll view
      const dailyRes = await fetch(`${API_BASE}/api/reports/daily/${employeeId}`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      const dailyData = await dailyRes.json();
      if (!dailyRes.ok) throw new Error(dailyData.error || "Failed to load daily summary");

      document.getElementById("detailStats").innerHTML = `
        Rate: ₹${dailyData.ratePerKm}/km &nbsp;|&nbsp;
        <b style="color:#22c55e">Total Pay Due: ₹${dailyData.totals.pay}</b>
        &nbsp;|&nbsp; Total Km: ${dailyData.totals.totalKm} (Billable: ${dailyData.totals.billableKm}, Personal: ${dailyData.totals.personalKm})
        &nbsp;|&nbsp; <button class="btn-download" onclick="downloadReport('${employeeId}')">Download CSV</button>
      `;

      renderDailySummary(dailyData.days);
    } catch (err) {
      document.getElementById("detailStats").textContent = "Error: " + err.message;
    }
  }

  let lastLoadedDays = [];

  async function downloadReport(employeeId) {
    try {
      const res = await fetch(`${API_BASE}/api/reports/export/${employeeId}`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!res.ok) {
        const data = await res.json();
        throw new Error(data.error || "Download failed");
      }
      const blob = await res.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${employeeId}-report.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(url);
    } catch (err) {
      alert(err.message);
    }
  }

  function renderDailySummary(days) {
    lastLoadedDays = days;
    const list = document.getElementById("dailyList");
    if (!days.length) {
      list.innerHTML = `<div style="color:#94a3b8; font-size:13px;">No activity recorded yet.</div>`;
      return;
    }
    list.innerHTML = "";
    // Most recent day first
    [...days].reverse().forEach((d, idx) => {
      const realIdx = days.length - 1 - idx; // index into lastLoadedDays
      const inTime = d.punchInTime ? new Date(d.punchInTime).toLocaleTimeString() : "—";
      const outTime = d.punchOutTime ? new Date(d.punchOutTime).toLocaleTimeString() : "—";
      const row = document.createElement("div");
      row.className = "day-row";

      const manualHtml = d.manualPunches.map((p) => `
        <div class="point-row">
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div>
              <b>${p.type === "in" ? "PUNCH IN" : "PUNCH OUT"}</b> · ${new Date(p.timestamp).toLocaleTimeString()}<br>
              <span class="mono">${p.latitude.toFixed(5)}, ${p.longitude.toFixed(5)}</span><br>
              ${p.placeName ? `<span class="place">${p.placeName}</span>` : ""}
            </div>
            <button class="btn-delete-point" onclick="deleteRecord('punch', '${p._id}')">✕</button>
          </div>
        </div>
      `).join("");

      const autoHtml = d.autoPings.map((p) => `
        <div class="point-row">
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div>
              <b>Auto point</b> · ${new Date(p.timestamp).toLocaleTimeString()} · ${p.cumulativeKm} km so far<br>
              <span class="mono">${p.latitude.toFixed(5)}, ${p.longitude.toFixed(5)}</span><br>
              ${p.placeName ? `<span class="place">${p.placeName}</span>` : ""}
            </div>
            <button class="btn-delete-point" onclick="deleteRecord('ping', '${p._id}')">✕</button>
          </div>
        </div>
      `).join("");

      row.innerHTML = `
        <div class="date">${d.date}</div>
        <div class="stat">Punch: ${inTime} → ${outTime} &nbsp;|&nbsp; Manual: ${d.punchCount} &nbsp;|&nbsp; Auto: ${d.pingCount}</div>
        <div class="stat">Total: ${d.totalKm} km &nbsp;|&nbsp; Billable: ${d.billableKm} km &nbsp;|&nbsp; Personal: ${d.personalKm} km</div>
        <div class="stat" style="color:#22c55e; font-weight:bold;">Pay: ₹${d.pay}</div>

        ${d.route.length > 0 ? `<button class="btn-route" onclick="showRouteOnMap(${realIdx})">View Route on Map</button>` : ""}

        <div class="section-toggle" onclick="toggleSection(this)">▸ Manual Punches (${d.punchCount})</div>
        <div class="section-body hidden">${manualHtml || '<div class="stat">None</div>'}</div>

        <div class="section-toggle" onclick="toggleSection(this)">▸ Auto Track Points (${d.pingCount})</div>
        <div class="section-body hidden">${autoHtml || '<div class="stat">None</div>'}</div>
      `;
      list.appendChild(row);
    });
  }

  async function deleteRecord(type, id) {
    if (!confirm("Delete this record permanently? This cannot be undone.")) return;
    try {
      const endpoint = type === "punch" ? "punch" : "tracking";
      const res = await fetch(`${API_BASE}/api/${endpoint}/record/${id}`, {
        method: "DELETE",
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to delete record");

      // Refresh the currently open employee's detail view
      if (currentDetailEmployeeId) await openDetail(currentDetailEmployeeId);
    } catch (err) {
      alert(err.message);
    }
  }

  function toggleSection(el) {
    const body = el.nextElementSibling;
    body.classList.toggle("hidden");
    el.textContent = el.textContent.replace(el.textContent[0], body.classList.contains("hidden") ? "▸" : "▾");
  }

  let routeLayerGroup = null;

  function showRouteOnMap(dayIndex) {
    const day = lastLoadedDays[dayIndex];
    if (!day || !day.route.length) return;

    closeModal();

    // Clear previous route drawing
    if (routeLayerGroup) {
      map.removeLayer(routeLayerGroup);
    }
    routeLayerGroup = L.layerGroup().addTo(map);

    const latlngs = day.route.map((p) => [p.latitude, p.longitude]);

    // Draw the path
    L.polyline(latlngs, { color: "#3b82f6", weight: 4 }).addTo(routeLayerGroup);

    // Start marker (green)
    const startIcon = L.divIcon({
      html: '<div style="background:#22c55e;width:16px;height:16px;border-radius:50%;border:3px solid white;"></div>',
      className: "", iconSize: [16, 16],
    });
    L.marker(latlngs[0], { icon: startIcon })
      .addTo(routeLayerGroup)
      .bindPopup(`<b>Start</b><br>${new Date(day.route[0].timestamp).toLocaleTimeString()}<br>${day.route[0].latitude.toFixed(5)}, ${day.route[0].longitude.toFixed(5)}`);

    // End marker (red) - only if more than one point
    if (latlngs.length > 1) {
      const endIcon = L.divIcon({
        html: '<div style="background:#ef4444;width:16px;height:16px;border-radius:50%;border:3px solid white;"></div>',
        className: "", iconSize: [16, 16],
      });
      const last = day.route[day.route.length - 1];
      L.marker(latlngs[latlngs.length - 1], { icon: endIcon })
        .addTo(routeLayerGroup)
        .bindPopup(`<b>Last point</b><br>${new Date(last.timestamp).toLocaleTimeString()}<br>${last.latitude.toFixed(5)}, ${last.longitude.toFixed(5)}`);
    }

    map.fitBounds(latlngs, { padding: [40, 40] });
  }

  function closeModal() {
    document.getElementById("detailModal").classList.add("hidden");
    currentDetailEmployeeId = null;
  }

  async function saveEdit() {
    const name = document.getElementById("editName").value.trim();
    const phone = document.getElementById("editPhone").value.trim();
    const ratePerKm = parseFloat(document.getElementById("editRate").value) || 0;
    const password = document.getElementById("editPassword").value;

    const body = { name, phone, ratePerKm };
    if (password) body.password = password;

    try {
      const res = await fetch(`${API_BASE}/api/auth/users/${currentDetailEmployeeId}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to save changes");

      alert("Saved successfully");
      closeModal();
      await loadEmployees();
    } catch (err) {
      alert(err.message);
    }
  }

  async function permanentDelete() {
    if (!confirm(`Permanently delete ${currentDetailEmployeeId}? This cannot be undone (their punch/ping history stays, but they can never log in again).`)) return;
    try {
      const res = await fetch(`${API_BASE}/api/auth/users/${currentDetailEmployeeId}/permanent`, {
        method: "DELETE",
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to delete");

      closeModal();
      await loadEmployees();
    } catch (err) {
      alert(err.message);
    }
  }

  // ---------- Live Tracking (Swiggy/Zomato-style) ----------
  let liveTrackingEmployeeId = null;
  let liveTrackingInterval = null;
  let liveRouteLayerGroup = null;

  function toggleLiveTracking(employeeId) {
    if (liveTrackingEmployeeId === employeeId) {
      stopLiveTracking();
    } else {
      startLiveTracking(employeeId);
    }
  }

  function startLiveTracking(employeeId) {
    stopLiveTracking(); // clear any previous live session first
    liveTrackingEmployeeId = employeeId;

    refreshLiveTrack(); // immediate first draw
    liveTrackingInterval = setInterval(refreshLiveTrack, 20000); // refresh every 20s

    loadEmployees(); // re-render list so button shows "Stop Live"
  }

  function stopLiveTracking() {
    if (liveTrackingInterval) clearInterval(liveTrackingInterval);
    liveTrackingInterval = null;
    liveTrackingEmployeeId = null;

    if (liveRouteLayerGroup) {
      map.removeLayer(liveRouteLayerGroup);
      liveRouteLayerGroup = null;
    }
    loadEmployees();
  }

  async function refreshLiveTrack() {
    if (!liveTrackingEmployeeId) return;

    try {
      // Get just today's data
      const today = new Date();
      const startOfDay = new Date(today.getFullYear(), today.getMonth(), today.getDate()).toISOString();

      const res = await fetch(`${API_BASE}/api/reports/daily/${liveTrackingEmployeeId}?from=${startOfDay}`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to load live track");

      const todayData = data.days.find((d) => d.date === toLocalDateKey(today));
      if (!todayData || !todayData.route.length) return; // nothing yet today

      drawLiveRoute(todayData.route);
    } catch (err) {
      console.log("Live tracking refresh failed:", err.message);
    }
  }

  function toLocalDateKey(date) {
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
  }

  function drawLiveRoute(route) {
    if (liveRouteLayerGroup) {
      map.removeLayer(liveRouteLayerGroup);
    }
    liveRouteLayerGroup = L.layerGroup().addTo(map);

    const latlngs = route.map((p) => [p.latitude, p.longitude]);

    L.polyline(latlngs, { color: "#3b82f6", weight: 4, dashArray: "6,6" }).addTo(liveRouteLayerGroup);

    // Pulsing current-position marker (last point)
    const currentIcon = L.divIcon({
      html: '<div class="pulse-dot"></div>',
      className: "", iconSize: [16, 16],
    });
    const last = route[route.length - 1];
    L.marker([last.latitude, last.longitude], { icon: currentIcon })
      .addTo(liveRouteLayerGroup)
      .bindPopup(`<b>Live position</b><br>Updated: ${new Date(last.timestamp).toLocaleTimeString()}<br>${last.latitude.toFixed(5)}, ${last.longitude.toFixed(5)}`);

    map.setView([last.latitude, last.longitude], 13);
  }

  function renderMapMarkers(users) {
    Object.values(markers).forEach((m) => map.removeLayer(m));
    markers = {};

    users.forEach((u) => {
      if (u.lastLocation?.latitude && u.lastLocation?.longitude) {
        const marker = L.marker([u.lastLocation.latitude, u.lastLocation.longitude])
          .addTo(map)
          .bindPopup(`<b>${u.name}</b><br>${u.employeeId}<br>${new Date(u.lastLocation.timestamp).toLocaleString()}<br>${u.lastLocation.latitude.toFixed(5)}, ${u.lastLocation.longitude.toFixed(5)}`);
        markers[u.employeeId] = marker;
      }
    });
  }

  async function addEmployee() {
    const employeeId = document.getElementById("newEmpId").value.trim();
    const name = document.getElementById("newEmpName").value.trim();
    const ratePerKm = parseFloat(document.getElementById("newEmpRate").value) || 0;
    const password = document.getElementById("newEmpPassword").value;

    if (!employeeId || !name || !password) {
      alert("Please fill all fields");
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/auth/users`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify({ employeeId, name, password, ratePerKm }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to add employee");

      document.getElementById("newEmpId").value = "";
      document.getElementById("newEmpName").value = "";
      document.getElementById("newEmpRate").value = "";
      document.getElementById("newEmpPassword").value = "";
      await loadEmployees();
    } catch (err) {
      alert(err.message);
    }
  }

  async function removeEmployee(employeeId) {
    if (!confirm(`Remove ${employeeId}? They will no longer be able to log in.`)) return;
    try {
      const res = await fetch(`${API_BASE}/api/auth/users/${employeeId}`, {
        method: "DELETE",
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to remove employee");
      await loadEmployees();
    } catch (err) {
      alert(err.message);
    }
  }

  // Auto-login if token already saved, and refresh every 30s for live tracking
  if (token) {
    showDashboard();
  }
  setInterval(() => {
    if (token) loadEmployees();
  }, 30000);
</script>
</body>
</html>
