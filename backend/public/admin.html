<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Admin Dashboard - Tracking App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    margin: 0; background: #0f172a; color: #f1f5f9;
  }
  .hidden { display: none !important; }

  /* Login screen */
  #loginScreen {
    display: flex; align-items: center; justify-content: center;
    height: 100vh;
  }
  .login-box {
    background: #1e293b; padding: 32px; border-radius: 12px; width: 320px;
  }
  .login-box h2 { margin-top: 0; text-align: center; }
  .login-box input {
    width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px;
    border: none; background: #0b1220; color: #f1f5f9; font-size: 14px;
  }
  .login-box button {
    width: 100%; padding: 12px; margin-top: 12px; border: none; border-radius: 8px;
    background: #22c55e; color: white; font-weight: bold; font-size: 14px; cursor: pointer;
  }
  .login-box button:hover { background: #16a34a; }
  .error-msg { color: #f87171; font-size: 13px; margin-top: 8px; text-align: center; }

  /* Dashboard */
  #dashboard { display: none; }
  header {
    padding: 16px 24px; background: #1e293b; display: flex;
    justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 18px; margin: 0; }
  header button {
    background: #334155; color: #f1f5f9; border: none; padding: 8px 16px;
    border-radius: 8px; cursor: pointer;
  }
  .layout { display: flex; height: calc(100vh - 60px); }
  #employeePanel {
    width: 340px; background: #1e293b; padding: 16px; overflow-y: auto;
  }
  #employeePanel h3 { margin-top: 0; }
  .emp-row {
    background: #0b1220; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 13px;
  }
  .emp-row .name { font-weight: bold; }
  .emp-row .sub { color: #94a3b8; font-size: 11px; }
  .emp-row button {
    background: #ef4444; color: white; border: none; padding: 6px 10px;
    border-radius: 6px; cursor: pointer; font-size: 11px;
  }
  #map { flex: 1; }
  .add-form { margin-top: 16px; border-top: 1px solid #334155; padding-top: 16px; }
  .add-form input, .add-form select {
    width: 100%; padding: 8px; margin: 4px 0; border-radius: 6px; border: none;
    background: #0b1220; color: #f1f5f9; font-size: 13px;
  }
  .add-form button {
    width: 100%; padding: 10px; margin-top: 8px; border: none; border-radius: 6px;
    background: #22c55e; color: white; font-weight: bold; cursor: pointer;
  }

  .emp-row { cursor: pointer; }
  .emp-row:hover { background: #16233a; }
  .emp-actions { display: flex; gap: 4px; }
  .emp-actions button { font-size: 11px; padding: 6px 8px; border: none; border-radius: 6px; cursor: pointer; }
  .btn-edit { background: #334155; color: #f1f5f9; }
  .btn-remove { background: #ef4444; color: white; }

  /* Modal */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center;
    z-index: 9999;
  }
  .modal-box {
    background: #1e293b; padding: 24px; border-radius: 12px; width: 600px;
    max-height: 80vh; overflow-y: auto;
  }
  .modal-box h2 { margin-top: 0; }
  .modal-box input, .modal-box select {
    width: 100%; padding: 10px; margin: 6px 0; border-radius: 8px;
    border: none; background: #0b1220; color: #f1f5f9; font-size: 14px;
  }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .modal-actions button {
    flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
  }
  .btn-save { background: #22c55e; color: white; }
  .btn-cancel { background: #334155; color: #f1f5f9; }
  .btn-danger { background: #ef4444; color: white; }

  .day-row {
    background: #0b1220; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 13px;
  }
  .day-row .date { font-weight: bold; color: #22c55e; }
  .day-row .stat { color: #94a3b8; }
  .day-row .btn-route {
    margin-top: 6px; background: #3b82f6; color: white; border: none;
    padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11px;
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-box">
    <h2>Manager Login</h2>
    <input id="loginEmployeeId" placeholder="Employee ID" />
    <input id="loginPassword" type="password" placeholder="Password" />
    <button onclick="login()">Log In</button>
    <div id="loginError" class="error-msg"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header>
    <h1>Employee Tracking Dashboard</h1>
    <button onclick="logout()">Log Out</button>
  </header>
  <div class="layout">
    <div id="employeePanel">
      <h3>Employees</h3>
      <div id="employeeList"></div>

      <div class="add-form">
        <h3>Add Employee</h3>
        <input id="newEmpId" placeholder="Employee ID (e.g. EMP002)" />
        <input id="newEmpName" placeholder="Full Name" />
        <input id="newEmpRate" type="number" step="0.01" placeholder="Pay Rate per Km (e.g. 10)" />
        <input id="newEmpPassword" type="password" placeholder="Temporary Password" />
        <button onclick="addEmployee()">Add Employee</button>
      </div>
    </div>
    <div id="map"></div>
  </div>
</div>

<!-- EMPLOYEE DETAIL / EDIT MODAL -->
<div id="detailModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h2 id="detailName">Employee</h2>
    <div id="detailStats" style="color:#94a3b8; font-size:13px; margin-bottom:12px;"></div>

    <h3 style="margin-bottom:6px;">Daily Summary (Punch In → Out, Km travelled)</h3>
    <div id="dailyList"></div>

    <h3 style="margin-bottom:6px; margin-top:20px;">Edit Employee</h3>
    <input id="editName" placeholder="Full Name" />
    <input id="editPhone" placeholder="Phone (optional)" />
    <input id="editRate" type="number" step="0.01" placeholder="Pay Rate per Km (e.g. 10)" />
    <input id="editPassword" type="password" placeholder="New Password (leave blank to keep current)" />
    <div class="modal-actions">
      <button class="btn-save" onclick="saveEdit()">Save Changes</button>
      <button class="btn-cancel" onclick="closeModal()">Close</button>
    </div>
    <div class="modal-actions">
      <button class="btn-danger" onclick="permanentDelete()">Permanently Delete Account</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Change this if your backend URL is different
  const API_BASE = window.location.origin;

  let token = localStorage.getItem("adminToken") || "";
  let map, markers = {};

  // ---------- Login ----------
  async function login() {
    const employeeId = document.getElementById("loginEmployeeId").value.trim();
    const password = document.getElementById("loginPassword").value;
    const errorBox = document.getElementById("loginError");
    errorBox.textContent = "";

    try {
      const res = await fetch(`${API_BASE}/api/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ employeeId, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Login failed");

      if (data.user.role !== "manager") {
        throw new Error("This account is not a manager. Use a manager account.");
      }

      token = data.token;
      localStorage.setItem("adminToken", token);
      showDashboard();
    } catch (err) {
      errorBox.textContent = err.message;
    }
  }

  function logout() {
    localStorage.removeItem("adminToken");
    token = "";
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("loginScreen").style.display = "flex";
  }

  // ---------- Dashboard ----------
  async function showDashboard() {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    initMap();
    await loadEmployees();
  }

  function initMap() {
    if (map) return;
    map = L.map("map").setView([22.7788, 73.6142], 7); // default center (Gujarat area)
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);
  }

  async function loadEmployees() {
    try {
      const res = await fetch(`${API_BASE}/api/auth/users`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to load employees");

      renderEmployeeList(data.users);
      renderMapMarkers(data.users);
    } catch (err) {
      alert(err.message);
    }
  }

  function renderEmployeeList(users) {
    const list = document.getElementById("employeeList");
    list.innerHTML = "";
    users.forEach((u) => {
      const row = document.createElement("div");
      row.className = "emp-row";
      const lastSeen = u.lastLocation?.timestamp
        ? new Date(u.lastLocation.timestamp).toLocaleString()
        : "Never";
      row.innerHTML = `
        <div onclick="openDetail('${u.employeeId}')" style="flex:1">
          <div class="name">${u.name} (${u.employeeId})</div>
          <div class="sub">${u.role} · ${u.active ? "active" : "inactive"} · last seen: ${lastSeen}</div>
        </div>
        ${u.role !== "manager" ? `
          <div class="emp-actions">
            <button class="btn-edit" onclick="event.stopPropagation(); openDetail('${u.employeeId}')">Edit</button>
            <button class="btn-remove" onclick="event.stopPropagation(); removeEmployee('${u.employeeId}')">Remove</button>
          </div>` : ""}
      `;
      list.appendChild(row);
    });
  }

  let currentDetailEmployeeId = null;

  async function openDetail(employeeId) {
    currentDetailEmployeeId = employeeId;
    document.getElementById("detailModal").classList.remove("hidden");
    document.getElementById("detailName").textContent = "Loading...";
    document.getElementById("dailyList").innerHTML = "";

    try {
      const usersRes = await fetch(`${API_BASE}/api/auth/users`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      const usersData = await usersRes.json();
      const emp = usersData.users.find((u) => u.employeeId === employeeId);

      document.getElementById("detailName").textContent = `${emp.name} (${emp.employeeId})`;
      document.getElementById("editName").value = emp.name;
      document.getElementById("editPhone").value = emp.phone || "";
      document.getElementById("editRate").value = emp.ratePerKm || 0;
      document.getElementById("editPassword").value = "";

      const dailyRes = await fetch(`${API_BASE}/api/reports/daily/${employeeId}`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      const dailyData = await dailyRes.json();
      if (!dailyRes.ok) throw new Error(dailyData.error || "Failed to load daily summary");

      document.getElementById("detailStats").innerHTML = `
        Rate: ₹${dailyData.ratePerKm}/km &nbsp;|&nbsp;
        <b style="color:#22c55e">Total Pay Due: ₹${dailyData.totals.pay}</b>
        &nbsp;|&nbsp; Total Km: ${dailyData.totals.totalKm} (Billable: ${dailyData.totals.billableKm}, Personal: ${dailyData.totals.personalKm})
      `;

      renderDailySummary(dailyData.days);
    } catch (err) {
      document.getElementById("detailStats").textContent = "Error: " + err.message;
    }
  }

  let lastLoadedDays = [];

  function renderDailySummary(days) {
    lastLoadedDays = days;
    const list = document.getElementById("dailyList");
    if (!days.length) {
      list.innerHTML = `<div style="color:#94a3b8; font-size:13px;">No activity recorded yet.</div>`;
      return;
    }
    list.innerHTML = "";
    [...days].reverse().forEach((d, idx) => {
      const realIdx = days.length - 1 - idx;
      const inTime = d.punchInTime ? new Date(d.punchInTime).toLocaleTimeString() : "—";
      const outTime = d.punchOutTime ? new Date(d.punchOutTime).toLocaleTimeString() : "—";
      const row = document.createElement("div");
      row.className = "day-row";
      row.innerHTML = `
        <div class="date">${d.date}</div>
        <div class="stat">Punch: ${inTime} → ${outTime} &nbsp;|&nbsp; Points: ${d.pingCount}</div>
        <div class="stat">Total: ${d.totalKm} km &nbsp;|&nbsp; Billable: ${d.billableKm} km &nbsp;|&nbsp; Personal: ${d.personalKm} km</div>
        <div class="stat" style="color:#22c55e; font-weight:bold;">Pay: ₹${d.pay}</div>
        ${d.route.length > 0 ? `<button class="btn-route" onclick="showRouteOnMap(${realIdx})">View Route on Map</button>` : ""}
      `;
      list.appendChild(row);
    });
  }

  let routeLayerGroup = null;

  function showRouteOnMap(dayIndex) {
    const day = lastLoadedDays[dayIndex];
    if (!day || !day.route.length) return;

    closeModal();

    if (routeLayerGroup) {
      map.removeLayer(routeLayerGroup);
    }
    routeLayerGroup = L.layerGroup().addTo(map);

    const latlngs = day.route.map((p) => [p.latitude, p.longitude]);

    L.polyline(latlngs, { color: "#3b82f6", weight: 4 }).addTo(routeLayerGroup);

    const startIcon = L.divIcon({
      html: '<div style="background:#22c55e;width:16px;height:16px;border-radius:50%;border:3px solid white;"></div>',
      className: "", iconSize: [16, 16],
    });
    L.marker(latlngs[0], { icon: startIcon })
      .addTo(routeLayerGroup)
      .bindPopup(`<b>Start</b><br>${new Date(day.route[0].timestamp).toLocaleTimeString()}`);

    if (latlngs.length > 1) {
      const endIcon = L.divIcon({
        html: '<div style="background:#ef4444;width:16px;height:16px;border-radius:50%;border:3px solid white;"></div>',
        className: "", iconSize: [16, 16],
      });
      const last = day.route[day.route.length - 1];
      L.marker(latlngs[latlngs.length - 1], { icon: endIcon })
        .addTo(routeLayerGroup)
        .bindPopup(`<b>Last point</b><br>${new Date(last.timestamp).toLocaleTimeString()}`);
    }

    map.fitBounds(latlngs, { padding: [40, 40] });
  }

  function closeModal() {
    document.getElementById("detailModal").classList.add("hidden");
    currentDetailEmployeeId = null;
  }

  async function saveEdit() {
    const name = document.getElementById("editName").value.trim();
    const phone = document.getElementById("editPhone").value.trim();
    const ratePerKm = parseFloat(document.getElementById("editRate").value) || 0;
    const password = document.getElementById("editPassword").value;

    const body = { name, phone, ratePerKm };
    if (password) body.password = password;

    try {
      const res = await fetch(`${API_BASE}/api/auth/users/${currentDetailEmployeeId}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to save changes");

      alert("Saved successfully");
      closeModal();
      await loadEmployees();
    } catch (err) {
      alert(err.message);
    }
  }

  async function permanentDelete() {
    if (!confirm(`Permanently delete ${currentDetailEmployeeId}? This cannot be undone (their punch/ping history stays, but they can never log in again).`)) return;
    try {
      const res = await fetch(`${API_BASE}/api/auth/users/${currentDetailEmployeeId}/permanent`, {
        method: "DELETE",
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to delete");

      closeModal();
      await loadEmployees();
    } catch (err) {
      alert(err.message);
    }
  }

  function renderMapMarkers(users) {
    Object.values(markers).forEach((m) => map.removeLayer(m));
    markers = {};

    users.forEach((u) => {
      if (u.lastLocation?.latitude && u.lastLocation?.longitude) {
        const marker = L.marker([u.lastLocation.latitude, u.lastLocation.longitude])
          .addTo(map)
          .bindPopup(`<b>${u.name}</b><br>${u.employeeId}<br>${new Date(u.lastLocation.timestamp).toLocaleString()}`);
        markers[u.employeeId] = marker;
      }
    });
  }

  async function addEmployee() {
    const employeeId = document.getElementById("newEmpId").value.trim();
    const name = document.getElementById("newEmpName").value.trim();
    const ratePerKm = parseFloat(document.getElementById("newEmpRate").value) || 0;
    const password = document.getElementById("newEmpPassword").value;

    if (!employeeId || !name || !password) {
      alert("Please fill all fields");
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/auth/users`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify({ employeeId, name, password, ratePerKm }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to add employee");

      document.getElementById("newEmpId").value = "";
      document.getElementById("newEmpName").value = "";
      document.getElementById("newEmpRate").value = "";
      document.getElementById("newEmpPassword").value = "";
      await loadEmployees();
    } catch (err) {
      alert(err.message);
    }
  }

  async function removeEmployee(employeeId) {
    if (!confirm(`Remove ${employeeId}? They will no longer be able to log in.`)) return;
    try {
      const res = await fetch(`${API_BASE}/api/auth/users/${employeeId}`, {
        method: "DELETE",
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to remove employee");
      await loadEmployees();
    } catch (err) {
      alert(err.message);
    }
  }

  if (token) {
    showDashboard();
  }
  setInterval(() => {
    if (token) loadEmployees();
  }, 30000);
</script>
</body>
</html>
