<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Tesseract Upload</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 24px; background: #f3f4f6; color: #111827;">
  <h1>Test Tesseract Photo Upload</h1>
  <p>Use this form to send a photo to the Flask OCR service at <code>http://127.0.0.1:5001/process-photo</code>.</p>
  <form action="http://127.0.0.1:5001/process-photo" method="post" enctype="multipart/form-data" style="display: grid; gap: 16px; max-width: 560px;">
    <label>
      Punch ID:<br />
      <input type="text" name="punch_id" value="EMP001" style="width: 100%; padding: 8px;" />
    </label>
    <label>
      Photo file:<br />
      <input type="file" name="photo" accept="image/*" style="width: 100%; padding: 8px;" />
    </label>
    <button type="submit" style="padding: 12px 18px; background: #2563eb; border: none; color: #fff; cursor: pointer; border-radius: 6px;">Upload and Process</button>
  </form>
  <p>If the upload succeeds, the browser will show the JSON response from the service.</p>
  <p>If you want to use a base64 payload instead, use a REST tool like Postman or curl.</p>
</body>
</html>
